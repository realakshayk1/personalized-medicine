name: Orchestrator bug
description: A bug in the FastAPI orchestrator — bad route behavior, planner regressions, executor errors, provenance log issues, sandbox dispatch problems.
title: "[orchestrator] <endpoint or component>: <one-line symptom>"
labels: ["area:orchestrator", "type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for bugs in `apps/orchestrator/lattice/**`. If the underlying issue is in a primitive (wrong output, sanity-check miss), use the **Primitive bug** template instead. If you're not sure which layer is at fault, use **Smoke finding**.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "app.py — FastAPI routes / lifespan"
        - "planner.py — Claude Agent SDK planner"
        - "executor.py — plan walker / SSE stream"
        - "provenance.py — SQLite log"
        - "sandbox.py — Fake/E2B dispatch"
        - "models.py — Pydantic wire models"
        - "other"
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Endpoint (if applicable)
      description: e.g. `POST /sessions/{id}/execute`, `GET /sessions/{id}/provenance`.
      placeholder: POST /sessions/{id}/plan

  - type: textarea
    id: request
    attributes:
      label: Request payload / arguments
      description: The body sent, or the function arguments if calling Python directly.
      render: json

  - type: textarea
    id: response_or_sse
    attributes:
      label: Response body or SSE event stream
      description: |
        For non-streaming endpoints: paste the JSON response.
        For `/execute` SSE: paste the raw event stream — one event per line in the format:

            event: step_started
            data: {"step_index": 0, "primitive": "calculate_qc_metrics"}
            event: step_completed
            data: {"step_index": 0, "result": {...}}
            event: plan_completed
            data: {"n_steps": 4}

        Garbage paste → unactionable issue → close. Format it.
      render: text
    validations:
      required: true

  - type: textarea
    id: provenance_excerpt
    attributes:
      label: Provenance log excerpt
      description: Output of `GET /sessions/{id}/provenance` for the affected session, or the relevant rows from the SQLite `steps` table.
      render: json

  - type: dropdown
    id: planner_source
    attributes:
      label: Planner source for this run
      description: Was the plan generated by the live Claude Agent SDK or a stubbed `chat_fn` in tests?
      options:
        - "live LLM (claude-agent-sdk)"
        - "stubbed chat_fn (tests)"
        - "hand-crafted Plan (manual)"
        - "not applicable"
    validations:
      required: true

  - type: input
    id: planner_prompt_version
    attributes:
      label: Planner prompt version
      description: Contents of `apps/orchestrator/prompts/VERSION`. Planner regressions across prompt-version bumps are a known failure mode — record the version so we can bisect.
      placeholder: "1"
    validations:
      required: true

  - type: dropdown
    id: sandbox_flavor
    attributes:
      label: Sandbox flavor
      options:
        - "FakeSandbox (in-process, default per ADR-003)"
        - "E2BSandbox (cloud)"
        - "not applicable"
    validations:
      required: true

  - type: input
    id: session_id
    attributes:
      label: session_id (for log correlation)
      description: The UUID assigned by `POST /sessions`. Lets the maintainer pull matching server logs.
      placeholder: 749e109a-a529-4079-bc6e-06960ea37b31

  - type: input
    id: lattice_commit
    attributes:
      label: Lattice commit / tag
      description: Output of `git rev-parse --short HEAD` or the tag.
    validations:
      required: true

  - type: textarea
    id: server_log
    attributes:
      label: Server log excerpt (optional)
      description: Loguru output from the orchestrator process around the time of the bug. Trim to relevant lines.
      render: text
