[project]
name = "lattice-primitives"
version = "0.1.0"
description = "Version-pinned, schema-validated bioinformatics primitives for Lattice"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10,<0.12",
    "scanpy>=1.11,<1.12",
    "numpy<2.0",
    "scipy>=1.11",
    "pandas>=2.0,<3",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "xxhash>=3.0",
    "igraph>=1.0.0",
    "pydeseq2>=0.5.2",
    "decoupler>=2.1.6",
    "harmonypy<0.1",
    "celltypist>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov",
    "ruff",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["lattice_primitives/_interface.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice_primitives"]
