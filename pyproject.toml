[project]
name = "lattice-workspace"
version = "0.0.1"
description = "Lattice — AI bench scientist for single-cell biology (workspace root)"
requires-python = ">=3.11,<3.13"

[tool.uv.workspace]
members = ["apps/orchestrator", "packages/primitives"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/.venv", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = ["build/", "dist/", ".venv/", "node_modules/"]

[[tool.mypy.overrides]]
module = ["scanpy.*", "anndata.*", "scipy.*", "scrublet.*", "harmonypy.*", "celltypist.*", "e2b_code_interpreter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/primitives/tests", "apps/orchestrator/tests", "tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
